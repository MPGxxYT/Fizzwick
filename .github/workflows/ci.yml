name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the Drink ID check reads House Drinks at the base commit
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Check no Drink IDs were removed
        run: node scripts/check-drink-ids.mjs "$BASE_REF"
        env:
          # PRs compare with their base; pushes with the previous commit
          # (all zeros on a new branch, which falls back to origin/main).
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Check House Spec photo sizes
        run: npm run check:photos
      # Only the browser: the runner already has the system libraries
      # Chromium needs, and installing them with --with-deps runs apt, which
      # can stall for ten minutes on a slow mirror. If the runner image ever
      # drops one, the e2e step fails naming it; add --with-deps back then.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - name: Check the server config
        run: npm run check:server
      # The deploy job ships this exact build, so what was tested is what goes out.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deploy at a time; a newer push waits for the one in progress.
    concurrency: deploy
    env:
      SERVER: ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf 'Host *\n  IdentityFile ~/.ssh/id_deploy\n  StrictHostKeyChecking accept-new\n' > ~/.ssh/config
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      # Copies compose.yaml, conf/ and dist/ into ~/fizzwick. Old files go
      # once the new ones are in place.
      - name: Copy the build to the server
        run: rsync --recursive --compress --delete-delay deploy/ dist "$SERVER:fizzwick/"

      - name: Start or reload the container
        run: ssh "$SERVER" "cd fizzwick && docker compose up --detach && docker compose exec -T web nginx -s reload"
