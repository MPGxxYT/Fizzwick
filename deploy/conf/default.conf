# Serves the static build inside the fizzwick container. Nginx Proxy Manager
# sits in front and handles HTTPS, so this only listens on plain HTTP inside
# the Docker network. The rules follow docs/deploy.md.
server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # The browser checks these two to find a new version, so they're never cached.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Nginx's list of file types has no .webmanifest, so name the type here
    # or browsers get it as raw bytes.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Hashed file names never change. A missing one is a 404, not index.html,
    # so the service worker never caches a page in place of a script.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Riff links and other app routes aren't files: answer them with the app.
    location / {
        try_files $uri /index.html;
    }
}
